# Portale amministrativo Adry — gestione semplice del catalogo Lyca.
backend:
  name: github
  repo: adry-it/adry
  branch: master

locale: it

media_folder: /assets/images/lyca
public_folder: assets/images/lyca
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1000
          height: 1000

collections:
  - name: products
    label: Prodotti
    files:
      - name: lyca
        label: Catalogo prodotti
        file: /data/lyca.json
        format: json
        fields:
          - label: Elenco prodotti (trascina per cambiare l'ordine)
            name: items
            widget: list
            label_singular: prodotto
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { label: Codice interno, name: id, widget: hidden, required: false }
              - { label: Nome prodotto, name: name, widget: string }
              - label: Categoria
                name: category
                widget: relation
                collection: categories
                search_fields: [title]
                value_field: title
                display_fields: [title]
                required: true
              - label: Formato
                name: size
                widget: relation
                collection: formats
                search_fields: [title]
                value_field: title
                display_fields: [title]
                required: false
              - { label: Descrizione, name: description, widget: text, required: false }
              - { label: Prezzo (€), name: price, widget: number, value_type: float, min: 0, required: false }
              - { label: Novità, name: is_new, widget: boolean, default: false }
              - { label: Disponibile, name: available, widget: boolean, default: true }
              - label: Foto prodotto
                name: images
                widget: image
                multiple: true
                required: false


  - name: services
    label: Servizi
    files:
      - name: catalog
        label: Catalogo servizi
        file: /data/services.json
        format: json
        fields:
          - label: Elenco servizi (trascina per cambiare l'ordine)
            name: items
            widget: list
            label_singular: servizio
            summary: "{{fields.name}} — {{fields.cat}}"
            fields:
              - { label: Codice interno, name: id, widget: string }
              - { label: Nome servizio, name: name, widget: string }
              - label: Reparto
                name: cat
                widget: select
                options:
                  - { label: Estetica, value: estetica }
                  - { label: Parrucchiera, value: parrucchiere }
              - { label: Descrizione, name: desc, widget: text }
              - { label: Prezzo (facoltativo), name: price, widget: string, required: false }
              - { label: Etichetta (facoltativa), name: badge, widget: string, required: false }
              - { label: Evidenzia come promo, name: promo, widget: boolean, default: false, required: false }
              - label: Icona
                name: icon
                widget: select
                options: [sparkle, face, drop, lotus, leaf, scissors]

  - name: categories
    label: Categorie
    label_singular: categoria
    folder: /data/categories
    create: true
    delete: true
    extension: yml
    format: yaml
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: Nome categoria, name: title, widget: string }

  - name: formats
    label: Formati
    label_singular: formato
    folder: /data/formats
    create: true
    delete: true
    extension: yml
    format: yaml
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: Formato / grammatura (es. 10 gr, 50 ml), name: title, widget: string }
